<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14223e"><title>Kreuzwort Meister</title><style>
*{box-sizing:border-box}body{margin:0;background:#101a30;color:white;font-family:system-ui,sans-serif}main{height:100dvh;max-width:750px;margin:auto;display:flex;flex-direction:column;gap:6px;padding:8px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;margin:0}.stats{font-size:13px;color:#f9d36b}.boardbox{flex:1;min-height:0;display:grid;place-items:center}.board{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;width:min(100%,53dvh,520px);aspect-ratio:1;background:#263853;padding:3px;border-radius:8px}.cell{border:0;border-radius:3px;background:#fff;color:#15233d;font-weight:800;font-size:clamp(12px,3.6vw,23px);min-width:0;padding:0;position:relative}.cell.black{background:#263853}.cell.active{background:#ffdf83}.cell.focus{outline:3px solid #3ca4fa;outline-offset:-3px}.cell.done{background:#aaf0c9}.clue{min-height:64px;background:#253956;border-radius:10px;text-align:center;padding:8px;display:grid;place-content:center}.clue small{color:#a9c4eb}.clue strong{font-size:15px}.toolbar{display:flex;gap:5px}.toolbar button{flex:1;border:0;border-radius:7px;padding:9px 2px;background:#34517a;color:white;font-weight:700}.keyboard{display:grid;gap:4px}.keyrow{display:flex;gap:3px;justify-content:center}.key{flex:1;max-width:65px;height:clamp(33px,5.8dvh,50px);border:0;border-radius:6px;background:#e6ecfa;color:#13223d;font-size:17px;font-weight:800}.key.delete{background:#ffd16e}.overlay{display:none;position:fixed;inset:0;background:#071025ed;z-index:5;align-items:center;justify-content:center;padding:18px;text-align:center}.overlay.show{display:flex}.modal{background:#263b5a;border-radius:20px;padding:30px;max-width:390px;width:100%}.modal button{padding:15px;border:0;border-radius:12px;background:#ffcf60;font-weight:800}.confetti{position:fixed;top:-20px;width:9px;height:15px;pointer-events:none;z-index:7;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110dvh) rotate(720deg)}}@media(max-height:680px){main{gap:3px;padding:4px}.board{width:min(100%,46dvh,420px)}.clue{min-height:47px;padding:4px}.key{height:30px}.toolbar button{padding:5px}}
</style></head><body><main><header><h1>🧩 Kreuzwort Meister</h1><span class="stats" id="stats"></span></header><div class="boardbox"><div class="board" id="board"></div></div><div class="clue"><small id="direction"></small><strong id="clue"></strong></div><div class="toolbar"><button id="prev">◀ Wort</button><button id="hint">💡 Tipp −15</button><button id="next">Wort ▶</button></div><div class="keyboard" id="keyboard"></div></main><div class="overlay" id="win"><div class="modal"><h2>🎉 GRATULATION!</h2><p>Rätselblatt vollständig gelöst!</p><h2 id="bonus"></h2><p id="level"></p><button id="again">Nächstes Rätsel ➜</button></div></div><script>
const words=[

es Hauses"],["GARTEN","Grüne Fläche am Haus"],["BLUME","Pflanze mit Blüte"],["BAUM","Große Pflanze mit Stamm"],["WIESE","Grüne Fläche mit Gras"],["WALD","Gebiet mit vielen Bäumen"],["BERG","Hohe Erhebung"],["FLUSS","Fließendes Gewässer"],["SEE","Stehendes Binnengewässer"],["MEER","Großes Salzwassergebiet"],["INSEL","Land ringsum von Wasser"],["STRAND","Sandiger Meeresrand"],["SONNE","Stern unseres Sonnensystems"],["MOND","Begleiter der Erde"],["STERN","Leuchtender Himmelskörper"],["WOLKE","Gebilde aus Wassertröpfchen"],["REGEN","Wasser fällt aus Wolken"],["SCHNEE","Weiße Flocken im Winter"],["WIND","Bewegte Luft"],["STURM","Sehr starker Wind"],["NEBEL","Trübe Luft mit Tropfen"],["SOMMER","Wärmste Jahreszeit"],["WINTER","Kälteste Jahreszeit"],["HERBST","Jahreszeit nach Sommer"],["MORGEN","Beginn des Tages"],["ABEND","Zeit vor der Nacht"],["NACHT","Dunkle Tageszeit"],["WOCHE","Sieben Tage"],["MONAT","Teil eines Jahres"],["JAHR","Zwölf Monate"],["UHR","Zeigt die Zeit"],["AUTO","Fahrzeug mit vier Rädern"],["BUS","Großes Fahrzeug für Fahrgäste"],["ZUG","Fährt auf Schienen"],["BAHN","Schienengebundenes Verkehrsmittel"],["FAHRRAD","Zweirad mit Pedalen"],["ROLLER","Fahrzeug mit Trittbrett"],["SCHIFF","Fahrzeug auf dem Wasser"],["BOOT","Kleines Wasserfahrzeug"],["FLUGZEUG","Fliegt mit Tragflächen"],["RAKETE","Flugkörper für den Weltraum"],["AMPEL","Regelt Straßenverkehr"],["STRASSE","Verkehrsweg für Autos"],["BRUECKE","Führt über ein Hindernis"],["TUNNEL","Weg durch einen Berg"],["SCHULE","Ort zum Lernen"],["BUCH","Gedrucktes Werk zum Lesen"],["HEFT","Zusammengeheftete Blätter"],["STIFT","Gerät zum Schreiben"],["PAPIER","Material zum Beschreiben"],["BRILLE","Sehhilfe auf der Nase"],["HAND","Körperteil mit fünf Fingern"],["FUSS","Körperteil am Beinende"],["KOPF","Oberster Körperteil"],["AUGE","Organ zum Sehen"],["OHR","Organ zum Hören"],["NASE","Organ zum Riechen"],["MUND","Zum Essen und Sprechen"],["ZAHN","Zum Kauen im Mund"],["HERZ","Pumpt Blut durch den Körper"],["BAUCH","Körperregion unter der Brust"],["FINGER","Einer von fünf an der Hand"],["FREUND","Person, die man gernhat"],["FAMILIE","Eltern und Kinder"],["KIND","Junger Mensch"],["MUTTER","Weiblicher Elternteil"],["VATER","Männlicher Elternteil"],["OMA","Großmutter"],["OPA","Großvater"],["MUSIK","Kunst aus Tönen"],["LIED","Gesungenes Musikstück"],["TANZ","Bewegung zur Musik"],["RADIO","Empfängt Hörfunksendungen"],["FILM","Bewegte Bilder mit Handlung"],["KINO","Ort zum Filmeanschauen"],["SPIEL","Unterhaltung mit Regeln"],["BALL","Rundes Spielgerät"],["TOR","Ziel beim Fußball"],["SPORT","Körperlicher Wettkampf"],["LAUFEN","Sich schnell zu Fuß bewegen"],["LESEN","Geschriebenes verstehen"],["MALEN","Bilder mit Farben gestalten"],["SINGEN","Melodie mit Stimme vortragen"],["LACHEN","Freude hörbar ausdrücken"],["DENKEN","Mit dem Kopf überlegen"],["TRAUM","Erlebnis im Schlaf"],["GLUECK","Große Freude oder gutes Schicksal"],["LIEBE","Starkes Gefühl der Zuneigung"],["ROT","Farbe reifer Erdbeeren"],["BLAU","Farbe des klaren Himmels"],["GRUEN","Farbe von Gras"],["GELB","Farbe einer Zitrone"],["WEISS","Farbe von Schnee"],["SCHWARZ","Dunkelste Farbe"],["BRAUN","Farbe von Schokolade"],["ROSA","Helle Mischung aus Rot und Weiß"],["GOLD","Gelbes Edelmetall"],["SILBER","Grauweißes Edelmetall"]
];const N=9;let saved={};try{saved=JSON.parse(localStorage.getItem("km-save"))||{}}catch{}let score=saved.score||0,round=saved.round||1,used=saved.used||[],g,entries,sel=0,pos=0,typed={},won=false;
const el=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5),k=(r,c)=>r+"-"+c;
function cells(e){return [...e.word].map((_,i)=>[e.r+(e.d?i:0),e.c+(e.d?0:i)])}
function valid(w,r,c,d,board){let dr=d?1:0,dc=d?0:1;if(r+dr*(w.length-1)>=N||c+dc*(w.length-1)>=N)return -1;let pr=r-dr,pc=c-dc,ar=r+dr*w.length,ac=c+dc*w.length;if(pr>=0&&pc>=0&&board[pr][pc]||ar<N&&ac<N&&board[ar][ac])return -1;let hits=0;for(let i=0;i<w.length;i++){let y=r+dr*i,x=c+dc*i;if(board[y][x]&&board[y][x]!==w[i])return -1;if(board[y][x])hits++;else if(d){if(x>0&&board[y][x-1]||x<N-1&&board[y][x+1])return -1}else if(y>0&&board[y-1][x]||y<N-1&&board[y+1][x])return -1}return hits}
function generate(){let best;for(let attempt=0;attempt<90;attempt++){let board=Array.from({length:N},()=>Array(N).fill(null)),es=[],pool=shuffle(words.filter(w=>!used.includes(w[0])));if(pool.length<25){used=[];pool=shuffle(words)}let [word,clue]=pool.shift(),r=Math.floor(Math.random()*N),c=Math.floor((N-word.length)/2);for(let i=0;i<word.length;i++)board[r][c+i]=word[i];es.push({word,clue,r,c,d:0});for(let [w,q] of pool){let choices=[];for(let d=0;d<2;d++)for(let y=0;y<N;y++)for(let x=0;x<N;x++){let n=valid(w,y,x,d,board);if(n>0)choices.push({r:y,c:x,d,n})}if(choices.length){choices.sort((a,b)=>b.n-a.n);let p=choices[Math.floor(Math.random()*Math.min(3,choices.length))];for(let i=0;i<w.length;i++)board[p.r+(p.d?i:0)][p.c+(p.d?0:i)]=w[i];es.push({word:w,clue:q,...p})}if(es.length>=10)break}if(!best||es.length>best.es.length)best={board,es};if(best.es.length>=7)break}return best}
function save(){try{localStorage.setItem("km-save",JSON.stringify({score,round,used}))}catch{}}
function start(){let p=generate();g=p.board;entries=p.es;typed={};sel=0;pos=0;won=false;el("win").classList.remove("show");draw()}
function pick(i){sel=(i+entries.length)%entries.length;let cs=cells(entries[sel]);pos=Math.max(0,cs.findIndex(([r,c])=>!typed[k(r,c)]));draw()}
function draw(){let board=el("board");board.replaceChildren();let active=cells(entries[sel]),focus=active[pos],set=new Set(active.map(([r,c])=>k(r,c)));for(let r=0;r<N;r++)for(let c=0;c<N;c++){let b=document.createElement("button");b.className="cell";if(!g[r][c]){b.classList.add("black");b.disabled=true}else{let id=k(r,c);if(set.has(id))b.classList.add("active");if(focus&&focus[0]===r&&focus[1]===c)b.classList.add("focus");if(entries.some(e=>cells(e).some(([y,x])=>y===r&&x===c)&&cells(e).every(([y,x],i)=>typed[k(y,x)]===e.word[i])))b.classList.add("done");b.textContent=typed[id]||"";b.onclick=()=>{let hits=entries.map((e,i)=>cells(e).some(([y,x])=>y===r&&x===c)?i:-1).filter(i=>i>=0);sel=hits.includes(sel)&&hits.length>1?hits.find(i=>i!==sel):hits[0];pos=cells(entries[sel]).findIndex(([y,x])=>y===r&&x===c);draw()}}board.append(b)}el("direction").textContent=(sel+1)+"/"+entries.length+" · "+(entries[sel].d?"Senkrecht":"Waagerecht")+" · "+entries[sel].word.length+" Buchstaben";el("clue").textContent=entries[sel].clue;el("stats").textContent="Blatt "+round+" · ⭐ "+score}
function input(ch){if(won)return;let cs=cells(entries[sel]);if(ch==="BACK"){let [r,c]=cs[pos];if(!typed[k(r,c)]&&pos>0)pos--;[r,c]=cs[pos];delete typed[k(r,c)]}else{let [r,c]=cs[pos];typed[k(r,c)]=ch;if(pos<cs.length-1)pos++}draw();check()}
function check(){if(entries.every(e=>cells(e).every(([r,c],i)=>typed[k(r,c)]===e.word[i]))){won=true;let bonus=100+entries.length*10;score+=bonus;round++;used.push(...entries.map(e=>e.word));save();el("bonus").textContent="+"+bonus+" Punkte";el("level").textContent="Gesamt: "+score+" Punkte · Nächstes Blatt: "+round;el("win").classList.add("show");for(let i=0;i<90;i++){let p=document.createElement("i");p.className="confetti";p.style.left=Math.random()*100+"vw";p.style.background=["#ffce54","#f96d9a","#4fd3b1","#6e9fff"][i%4];p.style.animationDelay=Math.random()*1.1+"s";document.body.append(p);setTimeout(()=>p.remove(),4300)}}}
for(let row of ["QWERTZUIOP","ASDFGHJKL","YXCVBNMÄÖÜ"]){let wrap=document.createElement("div");wrap.className="keyrow";for(let ch of row){let b=document.createElement("button");b.className="key";b.textContent=ch;b.onclick=()=>input(ch);wrap.append(b)}el("keyboard").append(wrap)}let row=document.createElement("div");row.className="keyrow";let del=document.createElement("button");del.className="key delete";del.style.maxWidth="100%";del.textContent="⌫ Buchstaben löschen";del.onclick=()=>input("BACK");row.append(del);el("keyboard").append(row);
el("prev").onclick=()=>pick(sel-1);el("next").onclick=()=>pick(sel+1);el("hint").onclick=()=>{if(score<15){alert("Für einen Tipp brauchst du 15 Punkte.");return}let cs=cells(entries[sel]);let missing=cs.findIndex(([r,c],i)=>typed[k(r,c)]!==entries[sel].word[i]);if(missing<0)return;score-=15;pos=missing;let [r,c]=cs[pos];typed[k(r,c)]=entries[sel].word[pos];save();draw();check()};el("again").onclick=start;start();
</script></body></html>
